databases:
  - name: cotizador-db
    plan: free
    databaseName: cotizador
    user: cotizador

services:
  - type: web
    name: cotizador-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cotizador-db
          property: connectionString
      - key: APP_ACCESS_CODE
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
