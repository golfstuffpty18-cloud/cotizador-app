name: Revisar correo de cotizaciones

on:
  schedule:
    # GitHub retrasa o descarta corridas justo en punto de hora (mayor carga);
    # se corre en el minuto :07 para evitar ese congestionamiento.
    - cron: "7 12-21 * * 1-5"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          PC_USUARIO: ${{ secrets.PC_USUARIO }}
          PC_CONTRASENA: ${{ secrets.PC_CONTRASENA }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
