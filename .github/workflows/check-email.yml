name: Revisar correo de cotizaciones

on:
  # El horario automático real ahora lo maneja cron-job.org llamando a
  # /api/cron/check-email (24/7, ciclo corto) — el schedule de GitHub Actions
  # demostró no ser confiable. Este workflow se deja solo para disparo manual.
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          PC_USUARIO: ${{ secrets.PC_USUARIO }}
          PC_CONTRASENA: ${{ secrets.PC_CONTRASENA }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
