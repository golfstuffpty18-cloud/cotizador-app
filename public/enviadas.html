<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizaciones enviadas | GS Technologies</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0a0a1a">
<link rel="stylesheet" href="/styles.css">
<style>
  .btn{ padding:10px 14px; border-radius:999px; border:2px solid var(--border); background:var(--surface); color:var(--text); font-weight:700; font-size:.82rem; cursor:pointer; width:100%; }
  .btn:disabled{ color:var(--text-faint); cursor:default; }
  .pending{ font-size:.78rem; color:var(--text-faint); text-align:center; padding:8px; }

  .cuadro-wrap{ margin-top:12px; }
  table.cuadro{ width:100%; border-collapse:collapse; font-size:.8rem; }
  table.cuadro th, table.cuadro td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
  table.cuadro th{ color:var(--text-faint); font-weight:700; text-transform:uppercase; font-size:.68rem; }
  table.cuadro tr.propia td{ font-weight:700; color:var(--blue); }
  .sin-datos{ font-size:.8rem; color:var(--text-faint); text-align:center; padding:14px 0; }
</style>
</head>
<body>
<script>window.PAGE_META = { title: 'Cotizaciones enviadas' };</script>
<div id="app-shell"></div>

<main class="content">
  <div id="list">Cargando…</div>
</main>

<script src="/icons.js"></script>
<script src="/shell.js"></script>
<script src="/enviadas.js"></script>
</body>
</html>
