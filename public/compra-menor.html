<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compra Menor | GS Technologies and Security Solutions</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0a0a1a">
<style>
  :root{
    --blue:#1616e6; --blue-dark:#0d0d9e; --navy:#0a0a1a; --navy-soft:#12122a;
    --gray-50:#f5f6fb; --gray-100:#e9eaf5; --gray-400:#8a8ca3; --gray-600:#565873;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--gray-50); color:#10101f;
  }
  header{
    background: var(--navy); color:#fff; padding:18px 20px;
    display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:10;
  }
  header a.back{ color:#fff; text-decoration:none; font-size:1.2rem; }
  header h1{ font-size:1rem; margin:0; font-weight:700; }
  header p{ margin:0; font-size:.72rem; color:rgba(255,255,255,.6); }

  main{ padding:14px 14px 40px; max-width:640px; margin:0 auto; }

  #searchBtn{
    display:block; width:100%; text-align:center; padding:12px 16px; border-radius:12px;
    border:none; background:var(--blue); color:#fff; font-weight:700; font-size:.9rem; cursor:pointer; margin-bottom:6px;
  }
  #status{ text-align:center; font-size:.8rem; color:var(--gray-600); margin:6px 0 14px; }

  .card{
    background:#fff; border-radius:14px; padding:18px; margin-bottom:14px;
    box-shadow:0 10px 24px -16px rgba(10,10,26,.25); border-left:6px solid var(--gray-100);
  }
  .card.participar{ border-left-color:#1fa971; }
  .card.no_participar{ border-left-color:#c0392b; }
  .card.revisar{ border-left-color:#e0a800; }

  .badge{
    display:inline-block; font-size:.68rem; font-weight:700; letter-spacing:.04em;
    text-transform:uppercase; padding:3px 9px; border-radius:999px; margin-bottom:8px;
  }
  .badge.participar{ background:#e6f7ef; color:#1fa971; }
  .badge.no_participar{ background:#fbe9e7; color:#c0392b; }
  .badge.revisar{ background:#fff6e0; color:#a97400; }

  .act{ font-size:.75rem; color:var(--gray-400); margin-bottom:4px; }
  .title{ font-size:.98rem; font-weight:700; color:var(--navy); margin-bottom:6px; line-height:1.3; }
  .entity{ font-size:.82rem; color:var(--gray-600); margin-bottom:8px; }
  .meta{ display:flex; flex-wrap:wrap; gap:10px; font-size:.78rem; color:var(--gray-600); margin-bottom:10px; }
  .meta b{ color:var(--navy); }
  .reasoning{ font-size:.8rem; color:var(--gray-600); background:var(--gray-50); border-radius:8px; padding:8px 10px; margin-bottom:12px; }

  .actions{ display:flex; gap:10px; }
  .actions button{
    flex:1; padding:10px; border-radius:999px; border:2px solid var(--gray-100);
    background:#fff; font-weight:700; font-size:.82rem; cursor:pointer;
  }
  .actions button.yes.active{ background:#1fa971; border-color:#1fa971; color:#fff; }
  .actions button.no.active{ background:#c0392b; border-color:#c0392b; color:#fff; }

  .quote-link{
    display:block; text-align:center; margin-top:10px; padding:10px;
    border-radius:999px; background:var(--blue); color:#fff; font-weight:700; font-size:.82rem; text-decoration:none;
  }

  .empty{ text-align:center; color:var(--gray-400); padding:60px 20px; font-size:.9rem; }
</style>
</head>
<body>
<header>
  <a href="/" class="back" title="Volver">←</a>
  <div style="flex:1">
    <h1>Compra Menor</h1>
    <p>$10,000 a $50,000 · Oportunidades de PanamaCompra</p>
  </div>
</header>

<main>
  <button id="searchBtn">🔍 Buscar Compra Menor por rubro</button>
  <div id="status"></div>
  <div id="list"></div>
</main>

<script src="/compra-menor.js"></script>
</body>
</html>
