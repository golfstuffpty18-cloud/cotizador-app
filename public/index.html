<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotización en línea | GS Technologies and Security Solutions</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0a0a1a">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<script>window.PAGE_META = { title: 'Cotización en línea' };</script>
<div id="app-shell"></div>

<main class="content">
  <section class="module-grid" id="moduleGrid"></section>

  <!-- Solo visible en celular (imagen de referencia 3) — en escritorio el
       dashboard se apega a la imagen de referencia 2, sin resumen de stats. -->
  <div class="stats-row" id="statsRow"></div>

  <div id="status" class="status-msg"></div>

  <h2 class="section-heading" id="listHeading" hidden>
    <span>Oportunidades detectadas</span>
    <button id="searchNowBtn" class="action-secondary" data-icon="search">Buscar ahora</button>
  </h2>

  <div class="empty-card" id="emptyState" hidden>
    <div class="empty-illustration" data-icon="inbox" data-icon-size="40"></div>
    <h2>Aún no hay oportunidades detectadas</h2>
    <p>Activa las notificaciones para recibir alertas cuando haya nuevas oportunidades de cotización.</p>
    <button id="notifActivateBtn" class="action-primary" data-icon="bell" data-icon-size="16">Activar notificaciones</button>
  </div>

  <div id="list"></div>
</main>

<script src="/icons.js"></script>
<script src="/shell.js"></script>
<script src="/app.js"></script>
</body>
</html>
