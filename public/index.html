<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotización en línea | GS Technologies and Security Solutions</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0a0a1a">
<style>
  :root{
    --blue:#1616e6; --blue-dark:#0d0d9e; --navy:#0a0a1a; --navy-soft:#12122a;
    --gray-50:#f5f6fb; --gray-100:#e9eaf5; --gray-400:#8a8ca3; --gray-600:#565873;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--gray-50); color:#10101f;
  }
  header{
    background: var(--navy); color:#fff; padding:18px 20px;
    display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:10;
  }
  header img{ width:36px; height:36px; border-radius:8px; }
  header h1{ font-size:1rem; margin:0; font-weight:700; }
  header p{ margin:0; font-size:.72rem; color:rgba(255,255,255,.6); }

  .quick-actions{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    margin:14px 16px 4px; max-width:640px; margin-left:auto; margin-right:auto;
    padding-left:14px; padding-right:14px;
  }
  .qa-btn{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:14px 6px; border-radius:14px; background:#fff; text-decoration:none;
    color:var(--navy); box-shadow:0 10px 24px -16px rgba(10,10,26,.25);
  }
  .qa-icon{ font-size:1.7rem; }
  .qa-label{ font-size:.68rem; font-weight:700; }

  #enableBtn{
    margin:14px 16px; padding:12px 16px; border-radius:12px; border:2px solid transparent;
    background:var(--blue); color:#fff; font-weight:700; font-size:.9rem; width:calc(100% - 32px);
  }
  #enableBtn.active{
    background:#fff; color:#1fa971; border-color:#1fa971;
  }
  #status{ text-align:center; font-size:.8rem; color:var(--gray-600); margin:6px 0 14px; }

  main{ padding:0 14px 40px; max-width:640px; margin:0 auto; }
  .card{
    background:#fff; border-radius:14px; padding:18px; margin-bottom:14px;
    box-shadow:0 10px 24px -16px rgba(10,10,26,.25); border-left:6px solid var(--gray-100);
  }
  .card.participar{ border-left-color:#1fa971; }
  .card.no_participar{ border-left-color:#c0392b; }
  .card.revisar{ border-left-color:#e0a800; }
  .card.pending-decided{ opacity:.55; }

  .badge{
    display:inline-block; font-size:.68rem; font-weight:700; letter-spacing:.04em;
    text-transform:uppercase; padding:3px 9px; border-radius:999px; margin-bottom:8px;
  }
  .badge.participar{ background:#e6f7ef; color:#1fa971; }
  .badge.no_participar{ background:#fbe9e7; color:#c0392b; }
  .badge.revisar{ background:#fff6e0; color:#a97400; }

  .act{ font-size:.75rem; color:var(--gray-400); margin-bottom:4px; }
  .title{ font-size:.98rem; font-weight:700; color:var(--navy); margin-bottom:6px; line-height:1.3; }
  .entity{ font-size:.82rem; color:var(--gray-600); margin-bottom:8px; }
  .meta{ display:flex; flex-wrap:wrap; gap:10px; font-size:.78rem; color:var(--gray-600); margin-bottom:10px; }
  .meta b{ color:var(--navy); }
  .reasoning{ font-size:.8rem; color:var(--gray-600); background:var(--gray-50); border-radius:8px; padding:8px 10px; margin-bottom:12px; }

  .actions{ display:flex; gap:10px; }
  .actions button{
    flex:1; padding:10px; border-radius:999px; border:2px solid var(--gray-100);
    background:#fff; font-weight:700; font-size:.82rem; cursor:pointer;
  }
  .actions button.yes.active{ background:#1fa971; border-color:#1fa971; color:#fff; }
  .actions button.no.active{ background:#c0392b; border-color:#c0392b; color:#fff; }

  .quote-link{
    display:block; text-align:center; margin-top:10px; padding:10px;
    border-radius:999px; background:var(--blue); color:#fff; font-weight:700; font-size:.82rem; text-decoration:none;
  }

  .empty{ text-align:center; color:var(--gray-400); padding:60px 20px; font-size:.9rem; }
</style>
</head>
<body>
<header>
  <img src="/icons/icon-192.png" alt="">
  <div style="flex:1">
    <h1>Cotización en línea</h1>
    <p>Oportunidades de PanamaCompra</p>
  </div>
</header>

<nav class="quick-actions">
  <a href="#" id="searchBtn" class="qa-btn" title="Buscar Cotización en línea por rubro">
    <span class="qa-icon">🔍</span><span class="qa-label">Cotización en línea</span>
  </a>
  <a href="/compra-menor.html" class="qa-btn" title="Compra Menor: $10,000 a $50,000">
    <span class="qa-icon">💰</span><span class="qa-label">Compra Menor</span>
  </a>
  <a href="/programadas.html" class="qa-btn" title="Cotizaciones programadas (aún no oficiales)">
    <span class="qa-icon">🗓️</span><span class="qa-label">Programadas</span>
  </a>
  <a href="/enviadas.html" class="qa-btn" title="Cotizaciones enviadas">
    <span class="qa-icon">📊</span><span class="qa-label">Enviadas</span>
  </a>
  <a href="/directo.html" class="qa-btn" title="Cotizaciones directas (fuera de PanamaCompra)">
    <span class="qa-icon">🧾</span><span class="qa-label">Directas</span>
  </a>
  <a href="/catalog.html" class="qa-btn" title="Catálogo de equipos">
    <span class="qa-icon">📋</span><span class="qa-label">Catálogo</span>
  </a>
  <a href="/finanzas.html" class="qa-btn" title="Facturas de gastos y emitidas, ganancias">
    <span class="qa-icon">💵</span><span class="qa-label">Finanzas</span>
  </a>
</nav>

<button id="enableBtn">Activar notificaciones</button>
<div id="status"></div>

<main id="list"></main>

<script src="/app.js"></script>
</body>
</html>
