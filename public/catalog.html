<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de equipos | GS Technologies</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0a0a1a">
<link rel="stylesheet" href="/styles.css">
<style>
  section{ background:var(--surface); border-radius:14px; padding:18px; margin-bottom:14px; box-shadow:var(--shadow); }
  section h2{ font-size:.85rem; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); margin:0 0 14px; }

  label{ display:block; font-size:.76rem; font-weight:600; color:var(--text); margin-bottom:4px; }
  input, select, textarea{
    width:100%; padding:9px 11px; border-radius:8px; border:2px solid var(--border);
    font-size:.85rem; font-family:inherit; margin-bottom:10px; background:var(--surface); color:var(--text);
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--blue); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }

  .cat-btn{ padding:11px 16px; border-radius:999px; border:2px solid transparent; font-weight:700; font-size:.85rem; cursor:pointer; }
  .cat-btn-primary{ background:var(--blue); color:#fff; width:100%; }
  .cat-btn-ghost{ background:var(--surface); border-color:var(--border); color:var(--text); }
  .cat-btn-danger{ background:var(--red-bg); color:var(--red); border:none; font-size:.75rem; padding:6px 12px; }

  .filters{ display:flex; gap:10px; margin-bottom:14px; }
  .filters input, .filters select{ margin-bottom:0; }

  .catalog-item{ border:2px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; }
  .catalog-item .desc{ font-weight:700; font-size:.86rem; color:var(--text); margin-bottom:4px; }
  .catalog-item .meta{ font-size:.76rem; color:var(--text-soft); margin-bottom:6px; }
  .catalog-item .price{ font-size:.86rem; color:var(--blue); font-weight:700; }
  .catalog-item .item-actions{ display:flex; justify-content:flex-end; margin-top:6px; }
  .badge-cat{ display:inline-block; background:var(--surface-2); color:var(--text-soft); font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:999px; margin-right:6px; }
</style>
</head>
<body>
<script>window.PAGE_META = { title: 'Catálogo de equipos' };</script>
<div id="app-shell"></div>

<main class="content" id="app">Cargando…</main>

<script src="/icons.js"></script>
<script src="/shell.js"></script>
<script src="/catalog.js"></script>
</body>
</html>
