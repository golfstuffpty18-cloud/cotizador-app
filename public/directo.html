<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizaciones directas | GS Technologies</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0a0a1a">
<link rel="stylesheet" href="/styles.css">
<style>
  section{ background:var(--surface); border-radius:14px; padding:18px; margin-bottom:14px; box-shadow:var(--shadow); }
  section h2{ font-size:.85rem; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); margin:0 0 14px; }

  label{ display:block; font-size:.78rem; font-weight:600; color:var(--text); margin-bottom:5px; }
  input, select{
    width:100%; padding:10px 12px; border-radius:8px; border:2px solid var(--border);
    font-size:.88rem; font-family:inherit; margin-bottom:12px; background:var(--surface); color:var(--text);
  }
  input:focus, select:focus{ outline:none; border-color:var(--blue); }

  .item-row{ display:grid; grid-template-columns:2fr 1fr 32px; gap:8px; align-items:start; margin-bottom:8px; }
  .item-row input{ margin-bottom:0; }
  .item-row .rm{
    height:40px; border-radius:8px; border:2px solid var(--border); background:var(--surface);
    color:#c0392b; font-weight:700; cursor:pointer;
  }

  .desc-wrap{ position:relative; }
  .sugg-list{
    display:none; position:absolute; top:calc(100% + 2px); left:0; right:0; z-index:20;
    background:var(--surface); border:2px solid var(--border); border-radius:10px; overflow:hidden;
    max-height:220px; overflow-y:auto; box-shadow:0 14px 28px -12px rgba(10,10,26,.3);
  }
  .sugg-item{ padding:9px 12px; cursor:pointer; font-size:.8rem; border-bottom:1px solid var(--border); }
  .sugg-item:last-child{ border-bottom:none; }
  .sugg-item:hover{ background:var(--surface-2); }
  .sugg-desc{ color:var(--text); }
  .sugg-hint{ font-size:.72rem; color:var(--text-faint); margin:-4px 0 10px; }

  .df-btn{ padding:12px; border-radius:999px; border:2px solid transparent; font-weight:700; font-size:.86rem; cursor:pointer; }
  .df-btn-primary{ background:var(--blue); color:#fff; width:100%; }
  .df-btn-add{ background:var(--surface-2); border:2px dashed var(--border); color:var(--text-soft); width:100%; margin-bottom:14px; }

  #msg{ text-align:center; font-size:.82rem; margin-top:10px; min-height:1.2em; color:var(--text-soft); }
</style>
</head>
<body>
<script>window.PAGE_META = { title: 'Cotizaciones directas' };</script>
<div id="app-shell"></div>

<main class="content">
  <h2 class="section-heading">
    <span>Cotizaciones directas</span>
    <a href="#" id="btnNueva" class="action-secondary" title="Nueva cotización directa">＋ Nueva</a>
  </h2>

  <section id="formSection" style="display:none">
    <h2>Nueva cotización directa</h2>
    <label for="titulo">Cliente / título del proyecto</label>
    <input type="text" id="titulo" placeholder="Ej. Residencia Sr. Pérez, Cadena XYZ...">

    <label for="categoria">Categoría</label>
    <select id="categoria"></select>

    <label>Ítems</label>
    <p class="sugg-hint">Al escribir, te sugerimos ítems ya cargados en el catálogo de esta categoría (así el Excel sale con el precio ya sugerido).</p>
    <div id="items"></div>
    <button type="button" class="df-btn df-btn-add" id="btnAddItem">+ Agregar ítem</button>

    <button type="button" class="df-btn df-btn-primary" id="btnCrear">Crear cotización</button>
    <div id="msg"></div>
  </section>

  <div id="list">Cargando…</div>
</main>

<script src="/icons.js"></script>
<script src="/shell.js"></script>
<script src="/directo.js"></script>
</body>
</html>
